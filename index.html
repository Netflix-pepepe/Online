<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🐺 人狼オンライン データベース</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f1117;color:#e8eaf0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
a{color:#7db7ff;text-decoration:none}
a:hover{text-decoration:underline}
button,input,select{font:inherit}
header{background:#171a23;border-bottom:1px solid #292e3a;padding:18px 22px;position:sticky;top:0;z-index:20}
h1{margin:0 0 5px;font-size:22px}
.sub{color:#9da5b5;font-size:13px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
nav button{background:#222735;color:#dce1eb;border:1px solid #343b4b;border-radius:8px;padding:8px 11px;cursor:pointer}
nav button.active{background:#35415a;border-color:#6384b8}
main{max-width:1400px;margin:auto;padding:22px}
.panel{background:#171a23;border:1px solid #292e3a;border-radius:12px;padding:18px;margin-bottom:18px}
h2{margin:0 0 15px;font-size:20px}
h3{margin:20px 0 10px}
label{display:block;color:#aeb6c5;font-size:13px;margin-bottom:5px}
input,select{background:#0f1219;color:#eee;border:1px solid #343b4b;border-radius:7px;padding:9px 10px;width:100%}
.row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.btn{background:#4776b8;border:0;color:#fff;border-radius:8px;padding:10px 16px;cursor:pointer}
.btn.secondary{background:#303746}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{background:#252b38;border:1px solid #343b4b;color:#ddd;padding:8px 12px;border-radius:7px;cursor:pointer}
.tabs button.active{background:#405a7d}
.notice{background:#202633;border-left:4px solid #628bc5;padding:10px 12px;border-radius:5px;color:#cbd2df;margin-bottom:14px}
.error{background:#382126;border-left:4px solid #d45d6b;padding:10px 12px;border-radius:5px;color:#ffd6da}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.stat{background:#10131a;border:1px solid #292e3a;border-radius:9px;padding:12px}
.stat b{display:block;font-size:21px;margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid #292e3a;padding:9px 7px;text-align:left;vertical-align:top}
th{color:#aeb6c5;background:#1b1f29;position:sticky;top:79px}
tr:hover td{background:#1b202b}
.badge{display:inline-block;background:#283142;border:1px solid #3b4659;padding:3px 7px;border-radius:5px;margin:2px;font-size:12px}
.card{background:#10131a;border:1px solid #292e3a;border-radius:9px;padding:13px;margin:8px 0}
.muted{color:#8f98a9}
.hidden{display:none!important}
.loading{padding:20px;text-align:center;color:#aeb6c5}
.more-wrap{text-align:center;padding:15px}
.click{cursor:pointer;color:#7db7ff}
@media(max-width:800px){
 main{padding:12px}
 .row{grid-template-columns:1fr}
 .stats{grid-template-columns:repeat(2,1fr)}
 table{font-size:12px}
 th,td{padding:7px 5px}
}
</style>
</head>
<body>

<header>
<h1>🐺 人狼オンライン データベース</h1>
<div class="sub">トリップ検索・戦績解析・ランキング・ゲーム解析</div>
<nav id="nav"></nav>
</header>

<main id="app"></main>

<script>
"use strict";

/*
 * GitHub Pages用・単体HTML版
 * 外部API:
 * https://ss1.xrea.com/zinrostats.s205.xrea.com/log_search
 */

const API="https://ss1.xrea.com/zinrostats.s205.xrea.com/log_search";
const PROXIES=[
    "",
    "https://api.allorigins.win/raw?url=",
    "https://corsproxy.io/?url="
];

const state={
    page:"about",
    searchMode:"name",
    query:"",
    games:[],
    playerRows:[],
    currentOffset:0,
    pageSize:30,
    loading:false,
    error:"",
    rankingMode:"name",
    rankingRows:[]
};

const navItems=[
    ["about","概要"],
    ["search","🔍 トリップ検索"],
    ["personal","📊 個人戦績"],
    ["ranking","🏆 ランキング"],
    ["relations","👥 同村関係"],
    ["game","🏘️ ゲーム解析"]
];

function esc(v){
    return String(v??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");
}

function nav(){
    document.getElementById("nav").innerHTML=navItems.map(x=>
        `<button class="${state.page===x[0]?"active":""}" onclick="showPage('${x[0]}')">${x[1]}</button>`
    ).join("");
}

function showPage(page){
    state.page=page;
    nav();
    if(page==="about") renderAbout();
    else if(page==="search") renderSearch();
    else if(page==="personal") renderPersonal();
    else if(page==="ranking") renderRanking();
    else if(page==="relations") renderRelations();
    else if(page==="game") renderGame();
}

function renderAbout(){
    document.getElementById("app").innerHTML=`
    <section class="panel">
        <h2>🐺 人狼オンライン データベース</h2>
        <div class="notice">
            公開ログ検索APIから実データを取得します。架空のプレイヤーやサンプル戦績は使用しません。
        </div>
        <p>名前・トリップから実際の参加ログを検索し、戦績・トリップ別集計・ランキングを表示します。</p>
        <p class="muted">GitHub Pagesから直接APIへ接続します。</p>
    </section>`;
}

function renderSearch(){
    document.getElementById("app").innerHTML=`
    <section class="panel">
        <h2>🔍 トリップ検索</h2>
        <div class="tabs">
            <button class="${state.searchMode==="name"?"active":""}" onclick="setSearchMode('name')">名前</button>
            <button class="${state.searchMode==="trip"?"active":""}" onclick="setSearchMode('trip')">トリップ</button>
        </div>
        <div class="row">
            <div>
                <label>${state.searchMode==="name"?"名前":"トリップ"}</label>
                <input id="searchInput" value="${esc(state.query)}"
                    placeholder="${state.searchMode==="name"?"例：Netflix":"例：◇Netflix.uQ"}"
                    onkeydown="if(event.key==='Enter')doSearch()">
            </div>
            <div></div>
            <button class="btn" onclick="doSearch()">🔎 検索</button>
        </div>
    </section>
    <section id="searchResult"></section>`;
}

function setSearchMode(mode){
    state.searchMode=mode;
    state.query="";
    renderSearch();
}

async function doSearch(){
    const input=document.getElementById("searchInput");
    state.query=(input?.value||"").trim();
    if(!state.query)return;

    state.loading=true;
    state.error="";
    document.getElementById("searchResult").innerHTML=`<section class="panel loading">実データを取得中……</section>`;

    try{
        state.games=await apiSearch(state.searchMode,state.query);
        state.games=uniqueGames(state.games);
        state.currentOffset=0;
        renderPersonalResult(state.searchMode,state.query);
    }catch(e){
        state.error=e.message||String(e);
        document.getElementById("searchResult").innerHTML=
            `<section class="panel error">取得エラー: ${esc(state.error)}</section>`;
    }finally{
        state.loading=false;
    }
}

function renderPersonal(){
    document.getElementById("app").innerHTML=`
    <section class="panel">
        <h2>📊 個人戦績</h2>
        <div class="notice">名前またはトリップを入力して、公開ログAPIから実データを検索します。</div>
        <div class="row">
            <div>
                <label>名前</label>
                <input id="pName" placeholder="名前">
            </div>
            <div>
                <label>トリップ</label>
                <input id="pTrip" placeholder="◇トリップ">
            </div>
            <button class="btn" onclick="personalSearch()">🔎 実データを検索</button>
        </div>
    </section>
    <section id="personalResult"></section>`;
}

async function personalSearch(){
    const name=document.getElementById("pName").value.trim();
    const trip=document.getElementById("pTrip").value.trim();

    if(!name&&!trip)return;

    const result=document.getElementById("personalResult");
    result.innerHTML=`<section class="panel loading">実データを取得中……</section>`;

    try{
        state.games=uniqueGames(await apiSearch(name?"name":"trip",name||trip));
        renderPersonalResult(name?"name":"trip",name||trip,"personalResult");
    }catch(e){
        result.innerHTML=`<section class="panel error">取得エラー: ${esc(e.message||e)}</section>`;
    }
}

function normalizeTrip(t){
    if(!t)return "";
    t=String(t).trim();
    return t;
}

function cleanName(n){
    return String(n??"").trim();
}

function isSystemPlayer(name){
    const n=cleanName(name).toLowerCase();
    return !n ||
        n==="初日犠牲者" ||
        n==="gm" ||
        n==="gm役" ||
        n==="ゲームマスター" ||
        n==="観戦者" ||
        n==="システム";
}

function getPlayers(game){
    if(!game)return[];
    return Array.isArray(game.players)?game.players:
        Array.isArray(game.player)?game.player:[];
}

function getGameId(game){
    return game.id??game.game_id??game.log_id??"";
}

function getGameDate(game){
    return game.date??game.datetime??game.created_at??game.time??"";
}

function dateValue(v){
    const d=new Date(v);
    return isNaN(d.getTime())?0:d.getTime();
}

function uniqueGames(games){
    const m=new Map();
    for(const g of games||[]){
        const id=String(getGameId(g)||JSON.stringify(g));
        if(!m.has(id))m.set(id,g);
    }
    return [...m.values()].sort((a,b)=>dateValue(getGameDate(b))-dateValue(getGameDate(a)));
}

function playerOfGame(game,mode,q){
    const qq=normalizeTrip(q).replace(/^◇/,"");
    return getPlayers(game).filter(p=>{
        const name=cleanName(p.name??p.player_name);
        const trip=normalizeTrip(p.trip??p.trip_id??p.tripcode);
        if(mode==="name")return name===q;
        return trip===q || trip.replace(/^◇/,"")===qq;
    });
}

function collectRows(games){
    const rows=[];
    for(const game of games){
        for(const p of getPlayers(game)){
            const name=cleanName(p.name??p.player_name);
            const trip=normalizeTrip(p.trip??p.trip_id??p.tripcode);
            if(isSystemPlayer(name))continue;
            rows.push({
                game,
                name,
                trip,
                job:p.job??p.role??p.job_name??"",
                win:isWin(p,game),
                mes:Number(p.mes??p.message_count??p.messages??0)||0
            });
        }
    }
    return rows;
}

function isWin(p,game){
    if(typeof p.win==="boolean")return p.win;
    if(String(p.result??"").includes("勝"))return true;
    if(String(p.result??"").toLowerCase()==="win")return true;
    if(String(p.die??"").includes("勝"))return false;

    const winner=String(game.winner??game.win_side??game.result??"");
    const side=String(p.side??p.team??p.camp??"");
    if(winner&&side&&winner===side)return true;

    return String(p.result??"")==="勝利";
}

function aggregate(rows,key){
    const map=new Map();

    for(const r of rows){
        const value=r[key]||"";
        if(!value)continue;

        if(!map.has(value)){
            map.set(value,{
                key:value,
                games:0,
                wins:0,
                messages:0,
                trips:new Map(),
                names:new Map()
            });
        }

        const x=map.get(value);
        x.games++;
        if(r.win)x.wins++;
        x.messages+=r.mes;

        if(r.trip){
            x.trips.set(r.trip,(x.trips.get(r.trip)||0)+1);
        }
        if(r.name){
            x.names.set(r.name,(x.names.get(r.name)||0)+1);
        }
    }

    return [...map.values()].sort((a,b)=>b.games-a.games);
}

function winRate(x){
    return x.games?((x.wins/x.games)*100).toFixed(1)+"%":"0.0%";
}

function renderPersonalResult(mode,q,target="searchResult"){
    const box=document.getElementById(target);
    if(!box)return;

    const selected=state.games.flatMap(g=>playerOfGame(g,mode,q).map(p=>({game:g,p})));
    const rows=selected.map(x=>{
        const p=x.p,g=x.game;
        return {
            game:g,
            name:cleanName(p.name??p.player_name),
            trip:normalizeTrip(p.trip??p.trip_id??p.tripcode),
            job:p.job??p.role??p.job_name??"",
            win:isWin(p,g),
            mes:Number(p.mes??p.message_count??p.messages??0)||0
        };
    }).filter(r=>!isSystemPlayer(r.name));

    const games=uniqueGames(rows.map(r=>r.game));
    const uniqueRows=[];
    const seen=new Set();

    for(const r of rows){
        const id=String(getGameId(r.game));
        const key=id+"|"+r.name+"|"+r.trip;
        if(!seen.has(key)){
            seen.add(key);
            uniqueRows.push(r);
        }
    }

    const total=uniqueRows.length;
    const wins=uniqueRows.filter(r=>r.win).length;
    const messages=uniqueRows.reduce((s,r)=>s+r.mes,0);

    const title=mode==="name"
        ? `${esc(q)}`
        : `${esc(normalizeTrip(q))}`;

    const grouped=mode==="name"
        ? aggregate(uniqueRows,"trip")
        : aggregate(uniqueRows,"name");

    const otherLabel=mode==="name"?"トリップ":"名前";
    const otherTitle=mode==="name"?"トリップ別戦績":"名前別戦績";

    box.innerHTML=`
    <section class="panel">
        <h2>📊 ${title}</h2>
        <div class="notice">取得 ${games.length}ゲーム（実データ）</div>

        <div class="stats">
            <div class="stat">参戦数<b>${total}</b></div>
            <div class="stat">勝利<b>${wins}</b></div>
            <div class="stat">勝率<b>${total?((wins/total)*100).toFixed(1):"0.0"}%</b></div>
            <div class="stat">発言数<b>${messages}</b></div>
        </div>

        <h3>${otherTitle}</h3>
        ${grouped.length?`
        <table>
            <thead>
                <tr>
                    <th>${otherLabel}</th>
                    <th>戦数</th>
                    <th>勝利</th>
                    <th>勝率</th>
                    <th>発言</th>
                </tr>
            </thead>
            <tbody>
            ${grouped.map(x=>{
                const href=mode==="name"
                    ? `javascript:searchByTrip(${JSON.stringify(x.key)})`
                    : `javascript:searchByName(${JSON.stringify(x.key)})`;
                return `<tr>
                    <td><a href="${href}">${esc(x.key)}</a></td>
                    <td>${x.games}</td>
                    <td>${x.wins}</td>
                    <td>${winRate(x)}</td>
                    <td>${x.messages}</td>
                </tr>`;
            }).join("")}
            </tbody>
        </table>`:`<div class="muted">該当データなし</div>`}

        <h3>参戦ログ</h3>
        <div id="logList"></div>
    </section>`;

    renderLogs(uniqueRows,target);
}

function renderLogs(rows,target){
    const box=document.getElementById("logList");
    if(!box)return;

    const sorted=[...rows].sort((a,b)=>dateValue(getGameDate(b.game))-dateValue(getGameDate(a.game)));
    const visible=sorted.slice(0,state.currentOffset+state.pageSize);

    box.innerHTML=visible.map(r=>{
        const id=getGameId(r.game);
        const room=r.game.room_name??r.game.room??r.game.name??"";
        const date=getGameDate(r.game);
        const url=id?`https://zinro.net/m/log.php?id=${encodeURIComponent(id)}`:"#";

        return `<div class="card">
            <div>
                <b>${esc(date)}</b>
                ${id?`　<a href="${url}" target="_blank" rel="noopener">ログID ${esc(id)} ↗</a>`:""}
            </div>
            <div>${esc(room)}</div>
            <div class="muted">
                ${esc(r.job||"役職不明")}　
                <span class="badge">${r.win?"勝利":"敗北"}</span>
                ${r.trip?`<span class="badge">${esc(r.trip)}</span>`:""}
            </div>
        </div>`;
    }).join("");

    if(visible.length<sorted.length){
        box.innerHTML+=`
        <div class="more-wrap">
            <button class="btn secondary" onclick="moreLogs()">もっと見る</button>
        </div>`;
    }
}

function moreLogs(){
    state.currentOffset+=state.pageSize;
    const box=document.getElementById("logList");
    if(!box)return;

    const sorted=[...state.games.flatMap(g=>{
        const arr=playerOfGame(g,state.searchMode,state.query);
        return arr.map(p=>({
            game:g,
            name:cleanName(p.name??p.player_name),
            trip:normalizeTrip(p.trip??p.trip_id??p.tripcode),
            job:p.job??p.role??"",
            win:isWin(p,g),
            mes:Number(p.mes??p.message_count??0)||0
        }));
    })].filter(r=>!isSystemPlayer(r.name));

    renderLogs(sorted,"");
}

function searchByName(name){
    state.page="personal";
    nav();
    document.getElementById("app").innerHTML=`
    <section class="panel">
        <h2>📊 個人戦績</h2>
        <div class="loading">検索中……</div>
    </section>`;

    apiSearch("name",name).then(g=>{
        state.games=uniqueGames(g);
        renderPersonalResult("name",name,"app");
    }).catch(e=>{
        document.getElementById("app").innerHTML=
            `<section class="panel error">取得エラー: ${esc(e.message||e)}</section>`;
    });
}

function searchByTrip(trip){
    state.page="personal";
    nav();
    document.getElementById("app").innerHTML=`
    <section class="panel">
        <h2>📊 トリップ戦績</h2>
        <div class="loading">検索中……</div>
    </section>`;

    apiSearch("trip",trip).then(g=>{
        state.games=uniqueGames(g);
        renderPersonalResult("trip",trip,"app");
    }).catch(e=>{
        document.getElementById("app").innerHTML=
            `<section class="panel error">取得エラー: ${esc(e.message||e)}</section>`;
    });
}

async function apiSearch(mode,value){
    const params=new URLSearchParams();

    if(mode==="name")params.set("name",value);
    else params.set("trip",value.replace(/^◇/,""));

    const url=API+"?"+params.toString();

    let lastError=null;

    for(const proxy of PROXIES){
        try{
            const target=proxy
                ? proxy+encodeURIComponent(url)
                : url;

            const res=await fetch(target,{
                method:"GET",
                cache:"no-store"
            });

            if(!res.ok)throw new Error("HTTP "+res.status);

            const data=await res.json();
            const games=extractGames(data);

            if(Array.isArray(games))return games;
        }catch(e){
            lastError=e;
        }
    }

    throw new Error(
        "公開ログAPIから取得できませんでした。"+
        (lastError?" ("+lastError.message+")":"")
    );
}

function extractGames(data){
    if(Array.isArray(data))return data;

    if(Array.isArray(data.log_data))return data.log_data;
    if(Array.isArray(data.logs))return data.logs;
    if(Array.isArray(data.games))return data.games;
    if(Array.isArray(data.data))return data.data;

    if(data.data&&Array.isArray(data.data.log_data))return data.data.log_data;
    if(data.result&&Array.isArray(data.result.log_data))return data.result.log_data;

    return [];
}

function renderRanking(){
    document.getElementById("app").innerHTML=`
    <section class="panel">
        <h2>🏆 ランキング</h2>
        <div class="notice">
            検索で取得した実ログだけを集計します。
            検索対象を増やすほどランキングが蓄積されます。
        </div>

        <div class="row">
            <div>
                <label>名前を検索してランキングへ追加</label>
                <input id="rankingSearch" placeholder="名前">
            </div>
            <div></div>
            <button class="btn" onclick="addRankingData()">実データ取得</button>
        </div>
    </section>

    <section class="panel">
        <div class="tabs">
            <button class="${state.rankingMode==="name"?"active":""}" onclick="setRankingMode('name')">名前別</button>
            <button class="${state.rankingMode==="trip"?"active":""}" onclick="setRankingMode('trip')">トリップ別</button>
        </div>
        <div id="rankingResult">
            <div class="muted">名前を検索するとランキングに追加されます。</div>
        </div>
    </section>`;
}

function setRankingMode(mode){
    state.rankingMode=mode;
    renderRanking();
    drawRanking();
}

async function addRankingData(){
    const name=document.getElementById("rankingSearch").value.trim();
    if(!name)return;

    const result=document.getElementById("rankingResult");
    result.innerHTML=`<div class="loading">実データ取得中……</div>`;

    try{
        const games=uniqueGames(await apiSearch("name",name));

        let all=[];
        for(const g of games){
            for(const p of getPlayers(g)){
                const n=cleanName(p.name??p.player_name);
                const t=normalizeTrip(p.trip??p.trip_id??p.tripcode);
                if(isSystemPlayer(n))continue;

                all.push({
                    game:g,
                    name:n,
                    trip:t,
                    win:isWin(p,g),
                    mes:Number(p.mes??p.message_count??p.messages??0)||0
                });
            }
        }

        const old=JSON.parse(localStorage.getItem("wolf_real_rows_v5")||"[]");
        const merged=old.concat(all);

        const unique=[];
        const seen=new Set();

        for(const r of merged){
            const k=String(getGameId(r.game))+"|"+r.name+"|"+r.trip;
            if(seen.has(k))continue;
            seen.add(k);
            unique.push(r);
        }

        localStorage.setItem("wolf_real_rows_v5",JSON.stringify(unique));
        drawRanking();
    }catch(e){
        result.innerHTML=`<div class="error">取得エラー: ${esc(e.message||e)}</div>`;
    }
}

function drawRanking(){
    const box=document.getElementById("rankingResult");
    if(!box)return;

    const rows=JSON.parse(localStorage.getItem("wolf_real_rows_v5")||"[]");

    if(!rows.length){
        box.innerHTML=`<div class="muted">実データなし</div>`;
        return;
    }

    const grouped=aggregate(rows,state.rankingMode==="name"?"name":"trip");

    box.innerHTML=`
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>${state.rankingMode==="name"?"名前":"トリップ"}</th>
                <th>戦数</th>
                <th>勝利</th>
                <th>勝率</th>
                <th>発言</th>
                <th>${state.rankingMode==="name"?"使用トリップ":"使用名前"}</th>
            </tr>
        </thead>
        <tbody>
        ${grouped.slice(0,200).map((x,i)=>{
            const details=state.rankingMode==="name"
                ? [...x.trips.entries()].sort((a,b)=>b[1]-a[1])
                : [...x.names.entries()].sort((a,b)=>b[1]-a[1]);

            return `<tr>
                <td>${i+1}</td>
                <td><b>${esc(x.key)}</b></td>
                <td>${x.games}</td>
                <td>${x.wins}</td>
                <td>${winRate(x)}</td>
                <td>${x.messages}</td>
                <td>${details.map(d=>`<span class="badge">${esc(d[0])} ${d[1]}戦</span>`).join("")}</td>
            </tr>`;
        }).join("")}
        </tbody>
    </table>`;
}

function renderRelations(){
    document.getElementById("app").innerHTML=`
    <section class="panel">
        <h2>👥 同村関係</h2>
        <div class="notice">名前検索後に、同じゲームへ参加したプレイヤーを集計できます。</div>
        <div class="row">
            <div>
                <label>名前</label>
                <input id="relName" placeholder="名前">
            </div>
            <div></div>
            <button class="btn" onclick="relationSearch()">検索</button>
        </div>
        <div id="relationResult"></div>
    </section>`;
}

async function relationSearch(){
    const name=document.getElementById("relName").value.trim();
    if(!name)return;

    const box=document.getElementById("relationResult");
    box.innerHTML=`<div class="loading">取得中……</div>`;

    try{
        const games=uniqueGames(await apiSearch("name",name));
        const map=new Map();

        for(const g of games){
            const ps=getPlayers(g);
            if(!ps.some(p=>cleanName(p.name??p.player_name)===name))continue;

            for(const p of ps){
                const n=cleanName(p.name??p.player_name);
                if(!n||n===name||isSystemPlayer(n))continue;
                map.set(n,(map.get(n)||0)+1);
            }
        }

        const arr=[...map.entries()].sort((a,b)=>b[1]-a[1]);

        box.innerHTML=`
        <h3>同村回数</h3>
        <table>
        <thead><tr><th>名前</th><th>同村数</th></tr></thead>
        <tbody>${arr.map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td></tr>`).join("")}</tbody>
        </table>`;
    }catch(e){
        box.innerHTML=`<div class="error">${esc(e.message||e)}</div>`;
    }
}

function renderGame(){
    document.getElementById("app").innerHTML=`
    <section class="panel">
        <h2>🏘️ ゲーム解析</h2>
        <div class="notice">ログIDを入力すると実ログページを直接開けます。</div>
        <div class="row">

                <label>ログID</label>
                <input id="gameId" placeholder="例：1242499">
            </div>
            <div></div>
            <button class="btn" onclick="openGame()">ログを開く</button>
        </div>
    </section>`;
}

function openGame(){
    const id=document.getElementById("gameId").value.trim();
    if(!id)return;
    window.open("https://zinro.net/m/log.php?id="+encodeURIComponent(id),"_blank","noopener");
}
